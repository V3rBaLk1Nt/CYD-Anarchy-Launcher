; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[elecrow]
board = esp32
board_build.f_flash = 80000000L
board_build.partitions = support_files/custom_4Mb_noOta.csv
build_src_filter =${env.build_src_filter} +<../boards/elecrow>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw

	-DOTA_TAG='"elecrow"'
	-DDISABLE_OTA

	# Configurações de hardware
	-DROTATION=1
	-DHAS_TOUCH=1

	#TFT Configs
	-D TFT_DATABUS_N=0        # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=4 # Arduino_ILI9341
	-DTFT_MISO=4
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=27
	-DTFT_IPS=0
	-DTFT_COL_OFS1=0
	-DTFT_ROW_OFS1=0
	-DTFT_COL_OFS2=0
	-DTFT_ROW_OFS2=0
	-DTOUCH_CS=33
	-D TOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DCYD28_TouchR_IRQ=36
	-DCYD28_TouchR_MISO=4
	-DCYD28_TouchR_MOSI=13
	-DCYD28_TouchR_CLK=14
	-DCYD28_TouchR_CS=33
	-DSDCARD_CS=5
	-DSDCARD_SCK=18
	-DSDCARD_MISO=19
	-DSDCARD_MOSI=23

lib_ignore =
	SensorLib
	XPowersLib

[elecrowS3]
board_build.partitions = support_files/custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/elecrow>
build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	# Configurações de hardware
	-DROTATION=1
	-DHAS_TOUCH=1

lib_deps =
	${env.lib_deps}
	https://github.com/mmMicky/TouchLib

lib_ignore =
	SensorLib
	XPowersLib

[env:elecrow-24B]
extends=elecrow
platform_packages = framework-arduinoespressif32-libs @ file://~/.platformio/packages/framework-arduinoespressif32-libs
board=esp32
build_unflags =
	-D CYD28_TouchR_IRQ=36
	-DCYD28_TouchR_MISO=4
	-DCYD28_TouchR_CS=33
build_flags =
	${elecrow.build_flags}
	-DDEVICE_NAME='"Anarchy DHM04624D"'
	-DOTA_TAG='"anarchy-dhm04624d"'
	-D ANARCHY_BRANDING=1
	-D ANARCHY_TOUCH_TELEMETRY=1
	-D ANARCHY_TOUCH_HOLDTEST=1
	-D HAS_RESISTIVE_TOUCH=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	# Wiring is the manufacturer netlist, proven by the factory schematic and
	# demo source: XPT2046 DOUT=12, DIN=13, DCLK=14, CS=33, PENIRQ=36.
	# The Elena image swap (MISO=33/CS=12) is a bad User_Setup; it reads the
	# pulled-up CS line and returns all ones (phantom 4095 press).
	-D CYD28_TouchR_MISO=4
	-D CYD28_TouchR_CS=33
	# Bit-bang path shares CLK/MOSI with the display; reattach them to the SPI
	# peripheral after each touch transaction or the panel freezes.
	-D CYD28_TouchR_SHARED_SPI_SCLK=14
	-D CYD28_TouchR_SHARED_SPI_MOSI=13
	# Shared HSPI touch; test polling mode to rule out GPIO36 IRQ wake gating.
	-D CYD28_TouchR_IRQ=-1
	-D SPI_TOUCH_FREQUENCY=600000
	# Factory demo getTouch(...,600); the measured working log on this panel
	# showed untouched z=0 and real presses at 1922..3031.
	-D CYD28_TouchR_Z_THRESH=600
	# Ⓐ🧩 Factory fallback for this specific DHM04624D panel, measured live
	# (2026-11-09): raw X 545..3572, raw Y 748..3505, axes swapped + Y inverted.
	# NVS calibration still overrides this when present; keep both in sync.
	-D CYD28_TouchR_ROT=4
	-D CYD28_TouchR_CAL_XMIN=545
	-D CYD28_TouchR_CAL_XMAX=3572
	-D CYD28_TouchR_CAL_YMIN=748
	-D CYD28_TouchR_CAL_YMAX=3505


[env:elecrow-24B-anarchy-race]
extends = env:elecrow-24B
board_build.partitions = support_files/custom_4Mb.csv
build_unflags =
	${env:elecrow-24B.build_unflags}
	-DDISABLE_OTA
extra_scripts =
	pre:support_files/check_submodules.py
	pre:support_files/prep_web_files.py
	support_files/enable_lto.py
	pre:support_files/upload_patch.py
	post:support_files/merge.py

[env:elecrow-28B]
extends=elecrow
board=esp32
build_flags =
	${elecrow.build_flags}
	-DDEVICE_NAME='"Elecrow ESP32 28B"'
 	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D HAS_RESISTIVE_TOUCH=1
	-D CYD28_TouchR_ROT=6
	-D CYD28_TouchR_CAL_XMIN=189
	-D CYD28_TouchR_CAL_XMAX=3416
	-D CYD28_TouchR_CAL_YMIN=359
	-D CYD28_TouchR_CAL_YMAX=3439

[env:elecrow-35B]
extends=elecrow
board=esp32
build_flags =
	${elecrow.build_flags}
	-DDEVICE_NAME='"Elecrow ESP32 35B"'
	-D TFT_DISPLAY_DRIVER_N=28 # Arduino_ILI9488, overrides the 9341 in [elecrow]
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	# CYD28_TouchR was constructed as (TFT_HEIGHT, TFT_WIDTH) before the HAL
	# migration -- touch.cpp's default (320,240) only matches elecrow-24B/28B,
	# so this variant needs the override to keep the same touch resolution.
	-D CYD28_DISPLAY_HOR_RES_MAX=480
	-D CYD28_DISPLAY_VER_RES_MAX=320
	-D HAS_RESISTIVE_TOUCH=1
	-D CYD28_TouchR_ROT=6
	-D CYD28_TouchR_CAL_XMIN=353
	-D CYD28_TouchR_CAL_XMAX=3568
	-D CYD28_TouchR_CAL_YMIN=269
	-D CYD28_TouchR_CAL_YMAX=3491
build_unflags =
	-D TFT_DISPLAY_DRIVER_N=4

[env:elecrow-35Bv2_2]
extends=env:elecrow-35B
board=esp32
build_flags =
	${env:elecrow-35B.build_flags}
	-DCYD28_TouchR_CS=12
	-DTFT_MISO=33

[env:elecrow-24B-anarchy25]
extends = env:elecrow-24B
platform_packages = framework-arduinoespressif32-libs @ file://~/.platformio/packages/framework-arduinoespressif32-libs
; NimBLE needs ~178 KB more than 0x130000 allows, so this env uses a
; wider app partition (blank flash past 0x140000, nothing stored there).
board_build.partitions = support_files/custom_4Mb_noOta_anarchy.csv
build_flags =
	${env:elecrow-24B.build_flags}
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
	-DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
	-DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
